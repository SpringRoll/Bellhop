name: npm-deploy

on:
  release:
    types: [released]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: install
        run: |
          npm ci
        env:
          CI: true

      - name: build
        run: |
          npm run build
        env:
          CI: true

      - name: test
        run: npm run github-test
        env:
          CI: true

      - name: publish
        run: npm publish
        env:
          CI: true
